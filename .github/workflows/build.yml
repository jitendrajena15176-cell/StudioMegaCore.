name: Build Android APK from Zip

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Extract Project Zip
        run: |
          mkdir -p project_root
          unzip -o StudioMegaCore.zip -d project_root
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Grant execute permission for gradlew
        run: chmod +x project_root/gradlew
        
      - name: Build Debug APK
        run: cd project_root && ./gradlew assembleDebug
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project_root/app/build/outputs/apk/debug/app-debug.apk
